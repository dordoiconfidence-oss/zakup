<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Закуп">
<meta name="theme-color" content="#f2f4f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Закуп</title>
<script>
/* Оформление: цвет и светлая/тёмная тема — своё на каждом телефоне */
window.THEMES={
  teal:{n:'Бирюза',L:{accent:'#2b8a97',accentbg:'#e1f1f3',bg:'#f2f4f5',chip:'#e5eaec'},D:{accent:'#4fb3c1',accentbg:'#0f2c31'}},
  ocean:{n:'Океан',L:{accent:'#1d6fd8',accentbg:'#e2edfc',bg:'#f1f4f9',chip:'#e3e9f2'},D:{accent:'#5b9dff',accentbg:'#13233f'}},
  indigo:{n:'Индиго',L:{accent:'#4f46e5',accentbg:'#e9e8fd',bg:'#f3f3f9',chip:'#e6e6f0'},D:{accent:'#8b85ff',accentbg:'#1f1d3d'}},
  violet:{n:'Сирень',L:{accent:'#7c3aed',accentbg:'#efe6fe',bg:'#f6f3fa',chip:'#ebe5f3'},D:{accent:'#a78bfa',accentbg:'#261a40'}},
  wine:{n:'Гранат',L:{accent:'#b4235a',accentbg:'#f9e2eb',bg:'#f8f3f5',chip:'#efe4e8'},D:{accent:'#ff6b9c',accentbg:'#3a1222'}},
  terra:{n:'Терракота',L:{accent:'#c4552a',accentbg:'#f9e7de',bg:'#f8f4f1',chip:'#efe6e0'},D:{accent:'#ff8a5b',accentbg:'#3a1d10'}},
  emerald:{n:'Изумруд',L:{accent:'#0b7a5e',accentbg:'#dcf1ea',bg:'#f1f5f3',chip:'#e2ebe7'},D:{accent:'#34c79d',accentbg:'#0d2b23'}},
  graphite:{n:'Графит',L:{accent:'#262b33',accentbg:'#e7e9ec',bg:'#f3f3f4',chip:'#e7e7e9'},D:{accent:'#7b8494',accentbg:'#22262c'}}
};
window.THEME_NEU={
  L:{card:'#fff',text:'#1b2124',muted:'#7c878c',line:'#e3e8ea',green:'#1f9d55',greenbg:'#e3f5ea',red:'#d93a2f',redbg:'#fde7e5',orange:'#c97a06',orangebg:'#fdf1dc',blue:'#2f6fdf',bluebg:'#e6eefc',shadow:'0 1px 2px rgba(0,0,0,.05)',bar:'rgba(255,255,255,.92)'},
  D:{bg:'#000',card:'#1a1d1f',text:'#eef2f3',muted:'#94a0a5',line:'#2a2f32',green:'#30d158',greenbg:'#12301d',red:'#ff5a4e',redbg:'#3a1614',orange:'#ffa726',orangebg:'#3a2a0e',blue:'#5b93ff',bluebg:'#13233f',chip:'#2a2f32',shadow:'none',bar:'rgba(26,29,31,.92)'}
};
window.themeGet=function(){var t='teal',m='auto';try{t=localStorage.getItem('zakup_theme')||t;m=localStorage.getItem('zakup_mode')||m;}catch(e){}if(!THEMES[t])t='teal';return {t:t,m:m};};
window.applyTheme=function(){var g=themeGet(),th=THEMES[g.t];var dark=g.m==='dark'||(g.m==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  var v={},k,src=[THEME_NEU[dark?'D':'L'],dark?th.D:th.L];src.forEach(function(o){for(k in o)v[k]=o[k];});
  var r=document.documentElement.style;for(k in v)r.setProperty('--'+k,v[k]);r.colorScheme=dark?'dark':'light';
  var ms=document.querySelectorAll('meta[name="theme-color"]');for(var i=0;i<ms.length;i++)ms[i].setAttribute('content',v.bg);};
applyTheme();
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
</script>
<style>
:root{--bg:#f2f4f5;--card:#fff;--text:#1b2124;--muted:#7c878c;--line:#e3e8ea;--accent:#2b8a97;--accentbg:#e1f1f3;--green:#1f9d55;--greenbg:#e3f5ea;--red:#d93a2f;--redbg:#fde7e5;--orange:#c97a06;--orangebg:#fdf1dc;--blue:#2f6fdf;--bluebg:#e6eefc;--chip:#e5eaec;--shadow:0 1px 2px rgba(0,0,0,.05);--bar:rgba(255,255,255,.92)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1a1d1f;--text:#eef2f3;--muted:#94a0a5;--line:#2a2f32;--accent:#4fb3c1;--accentbg:#0f2c31;--green:#30d158;--greenbg:#12301d;--red:#ff5a4e;--redbg:#3a1614;--orange:#ffa726;--orangebg:#3a2a0e;--blue:#5b93ff;--bluebg:#13233f;--chip:#2a2f32;--shadow:none;--bar:rgba(26,29,31,.92)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;font-size:17px;-webkit-text-size-adjust:100%;line-height:1.3}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(88px + env(safe-area-inset-bottom))}
body.nobar{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0;text-align:inherit}
input,select,textarea{font:inherit}
main{max-width:640px;margin:0 auto;padding:6px 16px 26px}
h1{font-size:32px;margin:10px 4px 12px;font-weight:700;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin:24px 6px 8px;display:flex;justify-content:space-between;gap:8px}
h2 span{text-transform:none;letter-spacing:0;font-weight:500}
.muted{color:var(--muted)}.pos{color:var(--green)}.neg{color:var(--red)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.list{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:58px;width:100%;text-align:left}
.row:last-child{border-bottom:none}
button.row:active,.row.tap:active{background:var(--chip)}
.grow{flex:1;min-width:0}
.t{font-weight:600}.s{font-size:14px;color:var(--muted);margin-top:2px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);font-size:24px;flex:none}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.amt small{display:block;font-size:12.5px;font-weight:600;margin-top:2px}
.badge{font-size:12px;font-weight:700;padding:4px 9px;border-radius:10px;white-space:nowrap;display:inline-block;vertical-align:middle}
.badge.g{background:var(--greenbg);color:var(--green)}.badge.o{background:var(--orangebg);color:var(--orange)}.badge.r{background:var(--redbg);color:var(--red)}.badge.m{background:var(--chip);color:var(--muted)}.badge.a{background:var(--accentbg);color:var(--accent)}.badge.b{background:var(--bluebg);color:var(--blue)}
.pchips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 8px;padding:2px 16px 6px;scrollbar-width:none}
.pchips::-webkit-scrollbar{display:none}
.pchip{flex:none;padding:0 14px;min-height:40px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:15px;font-weight:600;white-space:nowrap}
.pchip.on{background:var(--accent);color:#fff}
.pchip .c{opacity:.7;font-weight:500;margin-left:4px}
.field{display:block;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:0 12px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--accent)}
textarea.field{padding:10px 12px;min-height:76px}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=date].field{line-height:48px;text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:12px;background:var(--card);color:var(--accent);font-size:17px;font-weight:600;padding:0 14px;box-shadow:var(--shadow);text-align:center}
.btn:active{opacity:.7}
a.btn{text-decoration:none}
.btn.primary{background:var(--accent);color:#fff;box-shadow:none}
.btn.green{background:var(--green);color:#fff;box-shadow:none}
.btn.danger{color:var(--red)}
.btn.small{width:auto;min-height:40px;font-size:15px;padding:0 12px}
.btns{display:grid;gap:8px;margin-top:10px}.btns.two{grid-template-columns:1fr 1fr}
.hint{font-size:13px;color:var(--muted);margin:8px 6px 0;line-height:1.45}
.empty{text-align:center;color:var(--muted);padding:26px 16px;line-height:1.45}
.empty .e{font-size:40px;margin-bottom:4px}
.demo{background:var(--orangebg);color:var(--orange);border-radius:12px;padding:10px 14px;font-size:14px;margin:6px 0 4px;font-weight:600}
/* top bar for pages */
.topbar{display:flex;align-items:center;gap:8px;margin:4px -4px 6px}
.topbar .back{color:var(--accent);font-size:17px;padding:10px 6px;display:flex;align-items:center;gap:2px;font-weight:500}
.topbar .back b{font-size:26px;line-height:1;font-weight:400}
.topbar .tt{flex:1;text-align:center;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.topbar .sp{width:80px}
/* order page */
.ohead .nm{font-size:24px;font-weight:700;line-height:1.2}
.ohead .meta{color:var(--muted);font-size:14px;margin-top:4px}
.steps{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.step{flex:none;padding:0 12px;min-height:36px;border-radius:18px;font-size:14px;font-weight:600;background:var(--chip);color:var(--muted);white-space:nowrap}
.step.done{background:var(--accentbg);color:var(--accent)}
.step.cur{background:var(--accent);color:#fff}
.money{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.money .card{padding:12px}
.money .l{font-size:12.5px;color:var(--muted)}
.money .v{font-size:17px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;word-break:break-word}
.grp{font-size:13px;font-weight:700;color:var(--accent);padding:10px 16px 6px;background:var(--bg);text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between}
.grp span{color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0}
.item{display:flex;align-items:center;gap:10px;padding:10px 14px 10px 10px;border-bottom:1px solid var(--line);min-height:58px}
.item:last-child{border-bottom:none}
.ck{width:40px;height:40px;border-radius:20px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:transparent;background:var(--card)}
.ck.on{background:var(--green);border-color:var(--green);color:#fff}
.ck.v2{background:var(--accent);border-color:var(--accent);color:#fff;font-size:15px}
.ck.na{border-style:dashed;color:var(--muted);font-size:15px}
.item .body{flex:1;min-width:0;text-align:left}
.item .nm{font-weight:600;word-break:break-word}
.item .sub{font-size:13.5px;color:var(--muted);margin-top:2px}
.item.na .nm{text-decoration:line-through;color:var(--muted)}
.item .sum{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .sum b{display:block;font-size:16px}
.item .sum span{font-size:13px;color:var(--muted)}
.tot .kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tot .kv:last-child{border-bottom:none}
.tot .kv b{font-variant-numeric:tabular-nums}
.tot .kv.big{font-size:19px}
.tot .kv.big b{font-size:20px}
/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabbar.hide{display:none}
.tab{flex:1;color:var(--muted);font-size:11px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:500;text-align:center}
.tab svg{width:27px;height:27px}
.tab.active{color:var(--accent)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;max-height:94vh;overflow-y:auto;-webkit-overflow-scrolling:touch;max-width:640px;margin:0 auto;padding:0 16px calc(22px + env(safe-area-inset-bottom))}
.panel.anim{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.shh{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 -16px;padding:8px 16px;border-bottom:1px solid var(--line)}
.shh::before{content:'';position:absolute;top:6px;left:50%;width:40px;height:5px;border-radius:3px;background:var(--muted);opacity:.35;transform:translateX(-50%)}
.shh b{font-size:17px;text-align:center;flex:1;padding-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{color:var(--accent);font-size:17px;padding:16px 4px 6px;min-width:70px}
.lb.r{text-align:right;font-weight:600}
.shb{padding-top:8px}
.fl{display:block;font-size:13px;color:var(--muted);margin:16px 6px 6px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);color:var(--text);padding:0 14px;min-height:44px;border-radius:22px;font-size:16px;border:1.5px solid var(--line)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1.1fr .9fr 1fr;gap:8px}
.save{margin-top:18px;width:100%;height:54px;border-radius:14px;color:#fff;font-size:18px;font-weight:700;text-align:center;background:var(--accent)}
.box{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:15px}
.box.good{background:var(--greenbg)}.box.bad{background:var(--redbg)}.box.warn{background:var(--orangebg)}
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,34,36,.96);color:#fff;padding:12px 20px;border-radius:24px;font-size:15px;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
.big-amt{font-size:34px;font-weight:700;text-align:center;min-height:64px}
.qrow{display:grid;grid-template-columns:1fr 62px 78px 50px;gap:6px;align-items:center}
.qrow .field{padding:0 10px;min-height:50px}
.addbtn{height:50px;border-radius:12px;background:var(--accent);color:#fff;font-size:26px;font-weight:700;text-align:center}
.addbtn:active{opacity:.75}
.qitem{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:15px}
.qitem:last-child{border-bottom:none}
.qitem .xb{width:34px;height:34px;border-radius:17px;background:var(--chip);color:var(--red);font-size:18px;flex:none;text-align:center}
.prow{display:grid;grid-template-columns:1fr 96px 42px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .field{min-height:44px;text-align:right;font-weight:600}
.prow .ck{width:38px;height:38px}
details.more{margin-top:14px;background:var(--card);border-radius:12px;padding:0 12px}
details.more summary{padding:14px 2px;color:var(--accent);font-weight:600;font-size:15px;list-style:none;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
details.more[open]{padding-bottom:12px}
.ptable{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.ptable td{padding:6px 4px;border-bottom:1px solid var(--line)}
.ptable td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.th{width:44px;height:44px;border-radius:10px;overflow:hidden;flex:none;background:var(--chip);padding:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.phbox{display:flex;align-items:center;gap:12px;margin-top:14px}
.phbox .big{width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--chip);flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--muted)}
.phbox .big img{width:100%;height:100%;object-fit:cover}
.qcam{height:50px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:22px;text-align:center;overflow:hidden;padding:0}
.qcam img{width:100%;height:100%;object-fit:cover}
.qrow.cam{grid-template-columns:1fr 58px 72px 46px 46px}
.qtop{display:grid;grid-template-columns:1fr 50px;gap:6px;margin-top:14px}
.qbot{display:grid;grid-template-columns:62px 1fr 1fr 50px;gap:6px;margin-top:6px}
.qtop .field,.qbot .field{padding:0 10px;min-height:50px}
.qlab{display:grid;grid-template-columns:62px 1fr 1fr 50px;gap:6px;margin:8px 2px 0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.chips.sm{gap:6px}.chips.sm .chip{min-height:36px;padding:0 11px;font-size:15px}
.mkrow{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}.mkrow>span{font-size:14px;color:var(--muted);font-weight:600}
.prow.two{grid-template-columns:1fr 74px 74px 40px;gap:6px}
.prow.two.nock{grid-template-columns:1fr 80px 80px}
.prow.two .field{padding:0 8px;font-size:16px}
.prow.head{padding-top:4px;padding-bottom:4px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;text-align:right}
.prow.head div:first-child{text-align:left}
.mkup{color:var(--pos,#1a7f45);font-weight:600}
.shrow .th{width:54px;height:54px;border-radius:10px;overflow:hidden;flex:none;background:var(--chip)}
.shrow .th img{width:100%;height:100%;object-fit:cover}
.phstrip{display:flex;gap:8px;overflow-x:auto;padding:4px 0 6px;margin-top:6px}
.phstrip .ph{position:relative;flex:none;width:92px;height:92px;border-radius:12px;overflow:hidden;background:var(--chip)}
.phstrip .ph img{width:100%;height:100%;object-fit:cover}
.phstrip .ph .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:13px;background:rgba(0,0,0,.6);color:#fff;font-size:16px;text-align:center;line-height:26px}
.phstrip .ph .m{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:2px 6px}
.phstrip .add{flex:none;width:92px;height:92px;border-radius:12px;border:2px dashed var(--line);color:var(--accent);font-size:14px;font-weight:600;text-align:center;line-height:1.3}
.thgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.thc{border-radius:16px;padding:12px;border:2px solid var(--line);text-align:left;box-shadow:var(--shadow)}
.thc.on{border-color:var(--text)}
.thc .sw{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.thc .dot{width:28px;height:28px;border-radius:50%}
.thc .mb{height:26px;border-radius:8px;color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.thc .mc{height:8px;border-radius:4px;margin-top:6px}
.thc .nm{font-weight:700;margin-top:8px;font-size:15px}
.invopts{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.invopts select{flex:1;min-width:140px;min-height:42px;border-radius:12px;border:none;background:#fff;color:#1f2a2d;font-size:15px;padding:0 10px}
.invopts label{display:flex;align-items:center;gap:6px;font-size:14px;color:#1f2a2d;background:#fff;border-radius:12px;padding:0 12px;min-height:42px}
.pv{position:fixed;inset:0;z-index:95;background:#000;display:none;flex-direction:column}

<script type="module">
/* =====================================================================

   Пока здесь null — приложение работает в демо-режиме (данные только

   ===================================================================== */
const FIREBASE_CONFIG = {

  appId: "1:261884006121:web:7152fb8d9e70f8cf6f2a78"
};

const OWNER_EMAILS = ['dordoiconfidence@gmail.com'];   // владелец видит доход
const STAFF_NAMES = {'dordoiconfidence@gmail.com':'Эржигит'};

/* ============ helpers ============ */
const $=s=>document.querySelector(s),$$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoDate(new Date());
const fmtD=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):'';
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c;};
const nf=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const num=s=>{if(s==null)return null;s=String(s).replace(/[\s ]/g,'').replace(',','.');if(s==='')return null;const n=parseFloat(s);return isFinite(n)?n:null;};
const CUR={RUB:{s:'₽',w:'руб'},KGS:{s:'сом',w:'сом'},USD:{s:'$',w:'$'}};
const money=(n,c)=>nf.format(r2(n||0))+' '+(CUR[c]||CUR.RUB).w;
const numS=v=>v==null||v===''?'':String(v).replace('.',',');

/* ============ constants ============ */
const ST={pick:{t:'Подбор',c:'m'},reserve:{t:'Бронь',c:'a'},await:{t:'Ждём оплату',c:'o'},paid:{t:'Оплачен',c:'g'},buying:{t:'Закуп',c:'b'},check:{t:'Сверка',c:'b'},shipped:{t:'Отправлен',c:'o'},closed:{t:'Закрыт',c:'m'}};
const FLOW={fabric:['pick','reserve','await','paid','buying','shipped','closed'],cosm:['pick','await','paid','buying','check','shipped','closed']};
const TYPES={fabric:'Ткани и одежда',cosm:'Косметика'};
const TYPE_IC={fabric:'🧵',cosm:'💄'};
const NEXT={pick:{fabric:'Бронь: уточняем метраж',cosm:'Ждём предоплату'},reserve:'Счёт отправлен — ждём оплату',await:'Деньги получены',paid:'Начать закуп',buying:{fabric:'Всё выкуплено — отправка',cosm:'Закупили — сверка'},check:'Сверено — отправка',shipped:'Всё оплачено — закрыть заказ'};
const IST={req:'Запрошено',res:'Забронировано',bought:'Выкуплено',checked:'Проверено',na:'Нет в наличии'};
const UNITS=['м','шт','пач','рул','кг','уп'];
const METHODS=['Золотая корона','Астрасенд','Карта','Наличные','Другое'];
const MESSENGERS=['WhatsApp','Telegram','VK','Instagram'];
const DEFAULT_SETTINGS={brand:'dordoi.confidence',instagram:'dordoi.confidence',phone:'996-220-276-236 Эржигит (Руководитель)',footer:'Заказ производится в инд. группах',commission:5,packing:300,owners:[],staff:{},rates:{RUB_KGS:1.1,KGS_RUB:0.9}};
const UNIT_MAP=[[/^(шт|штук|штуки|штука|бут)/i,'шт'],[/^(уп|упак)/i,'уп'],[/^пач/i,'пач'],[/^(м|метр)/i,'м'],[/^рул/i,'рул'],[/^кг/i,'кг']];

/* ============ data layer: Firebase or local demo ============ */
const cache={orders:{},clients:{},meta:{},shop:{}};
const DEL={__del:1};
let mode=FIREBASE_CONFIG?'cloud':'local',fb=null,me=null,authReady=false,local=null;
const LKEY='zakup_local_v1';
function setPath(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){if(typeof o[ks[i]]!=='object'||o[ks[i]]===null)o[ks[i]]={};o=o[ks[i]];}if(val===DEL)delete o[ks.at(-1)];else o[ks.at(-1)]=val;}
function localSave(){try{localStorage.setItem(LKEY,JSON.stringify(local));}catch(e){alert('Не удалось сохранить данные: мало места на телефоне.');}}
function fbVal(v){if(v===DEL)return fb.deleteField();if(v&&typeof v==='object'&&!Array.isArray(v)){const o={};for(const k in v)o[k]=fbVal(v[k]);return o;}return v;}
const onErr=e=>{console.error(e);toast(e&&e.code==='permission-denied'?'Нет доступа: эта почта не добавлена в правила':'Ошибка сохранения: '+(e&&e.message||e));};
const DB={
  set(coll,id,data){data=Object.assign({},data,{updatedAt:Date.now(),updatedBy:me?me.email:''});
    if(mode==='local'){(local[coll]=local[coll]||{})[id]=clone(data);(cache[coll]=cache[coll]||{})[id]=clone(data);localSave();scheduleRender();return;}
    fb.setDoc(fb.doc(fb.db,coll,id),fbVal(data)).catch(onErr);},
  update(coll,id,patch){patch=Object.assign({},patch,{updatedAt:Date.now(),updatedBy:me?me.email:''});
    if(mode==='local'){const d=(local[coll]||{})[id];if(!d)return;for(const k in patch)setPath(d,k,patch[k]);cache[coll][id]=clone(d);localSave();scheduleRender();return;}
    const p={};for(const k in patch)p[k]=fbVal(patch[k]);fb.updateDoc(fb.doc(fb.db,coll,id),p).catch(onErr);},
  remove(coll,id){if(mode==='local'){if(local[coll])delete local[coll][id];if(cache[coll])delete cache[coll][id];localSave();scheduleRender();return;}fb.deleteDoc(fb.doc(fb.db,coll,id)).catch(onErr);},
};
/* ---- photos: separate collection, compressed ---- */
const photoCache={};
function compressImage(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Не удалось открыть фото'));};img.src=url;});}
function putPhoto(dataUrl,orderId){const id='ph'+uid();photoCache[id]=dataUrl;
  if(mode==='local'){local.photos=local.photos||{};local.photos[id]=dataUrl;localSave();}
  else fb.setDoc(fb.doc(fb.db,'photos',id),{data:dataUrl,orderId:orderId||'',created:Date.now(),by:me.email}).catch(onErr);
  return id;}
async function getPhoto(id){if(!id)return null;if(photoCache[id])return photoCache[id];
  if(mode==='local'){return (local.photos||{})[id]||null;}
  try{const s=await fb.getDoc(fb.doc(fb.db,'photos',id));if(s.exists()){photoCache[id]=s.data().data;return photoCache[id];}}catch(e){}return null;}
function delPhoto(id){if(!id)return;delete photoCache[id];if(mode==='local'){if(local.photos){delete local.photos[id];localSave();}}else fb.deleteDoc(fb.doc(fb.db,'photos',id)).catch(()=>{});}
function hydratePhotos(root){$$('img[data-ph]',root).forEach(async img=>{if(img.getAttribute('src'))return;const v=await getPhoto(img.dataset.ph);if(v)img.src=v;});}
function pickPhoto(orderId,cb,max){const inp=$('#phInput');inp.value='';inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;try{const d=await compressImage(f,max||720,0.62);cb(putPhoto(d,orderId));}catch(e){alert(e.message||e);}};inp.click();}
let pvCtx=null,formPhoto=null;
$('#pvDel').addEventListener('click',()=>{if(!pvCtx||!pvCtx.onDelete||!confirm('Удалить это фото?'))return;pvCtx.onDelete();$('#pv').classList.remove('show');toast('Фото удалено');});
async function viewPhoto(id,onDelete){pvCtx={id,onDelete};$('#pvImg').removeAttribute('src');$('#pv').classList.add('show');$('#pvDel').style.display=onDelete?'':'none';const v=await getPhoto(id);if(v)$('#pvImg').src=v;}
async function initData(){
  if(mode==='local'){
    try{local=JSON.parse(localStorage.getItem(LKEY));}catch(e){}
    if(!local||!local.orders)local={orders:{},clients:{},meta:{}};
    cache.orders=clone(local.orders);cache.clients=clone(local.clients);cache.meta=clone(local.meta||{});cache.shop=clone(local.shop||{});
    me={email:'demo',uid:'demo'};authReady=true;
    if(!cache.meta.settings){DB.set('meta','settings',Object.assign(clone(DEFAULT_SETTINGS),{owners:['demo'],staff:{demo:'Эржигит'}}));}
    renderAll();return;
  }
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  try{
    const [appM,authM,fsM]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    const app=appM.initializeApp(FIREBASE_CONFIG);
    let db;try{db=fsM.initializeFirestore(app,{localCache:fsM.persistentLocalCache({tabManager:fsM.persistentSingleTabManager()})});}catch(e){db=fsM.getFirestore(app);}
    fb=Object.assign({app,db,auth:authM.getAuth(app)},authM,fsM);
  }catch(e){$('#main').innerHTML='<div class="login"><h1>Нет связи</h1><p class="muted">Не удалось загрузить приложение. Проверьте интернет и откройте снова — после первого запуска оно будет работать и без сети.</p></div>';return;}
  let unsubs=[];
  fb.onAuthStateChanged(fb.auth,user=>{
    unsubs.forEach(u=>u());unsubs=[];
    if(!user){me=null;authReady=true;cache.orders={};cache.clients={};cache.meta={};cache.shop={};renderAll();return;}
    me={email:(user.email||'').toLowerCase(),uid:user.uid};authReady=true;
    const sub=(coll)=>fb.onSnapshot(fb.collection(fb.db,coll),snap=>{const o={};snap.forEach(d=>{o[d.id]=d.data();});cache[coll]=o;
      if(coll==='meta'&&!o.settings&&!snap.metadata.fromCache){DB.set('meta','settings',Object.assign(clone(DEFAULT_SETTINGS),{owners:OWNER_EMAILS.slice(),staff:Object.assign({[me.email]:me.email.split('@')[0]},STAFF_NAMES)}));}
      scheduleRender();},onErr);
    unsubs=[sub('orders'),sub('clients'),sub('meta'),sub('shop')];
    renderAll();
  });
}
const S=()=>Object.assign(clone(DEFAULT_SETTINGS),cache.meta.settings||{});
const isOwner=()=>mode==='local'||(me&&S().owners.map(x=>x.toLowerCase()).includes(me.email));
const staffName=e=>{const s=S().staff||{};return s[e]||(e?e.split('@')[0]:'');};
const myName=()=>me?staffName(me.email):'';

/* ============ model ============ */
const orders=()=>Object.entries(cache.orders).map(([id,o])=>Object.assign({id},o));
const clients=()=>Object.entries(cache.clients).map(([id,c])=>Object.assign({id},c)).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ru'));
const order=id=>cache.orders[id]?Object.assign({id},cache.orders[id]):null;
const client=id=>cache.clients[id]?Object.assign({id},cache.clients[id]):null;
const itemsOf=o=>Object.entries(o.items||{}).map(([id,it])=>Object.assign({id},it)).sort((a,b)=>(a.ord||0)-(b.ord||0));
const paysOf=o=>Object.entries(o.payments||{}).map(([id,p])=>Object.assign({id},p)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.created||0)-(b.created||0));
const isDone=it=>it.status==='bought'||it.status==='checked';
function calc(o){
  const items=itemsOf(o);let goods=0,markup=0,n=0,bought=0,supKnown=0;
  items.forEach(it=>{if(it.status==='na')return;n++;const q=+it.qty||0,s=q*(+it.price||0);goods+=s;if(isDone(it))bought++;if(it.priceSup!=null&&it.priceSup!==''){markup+=q*((+it.price||0)-(+it.priceSup));supKnown++;}});
  let boughtGoods=0,todo=0,todoSum=0;items.forEach(it=>{if(it.status==='na')return;const s=(+it.qty||0)*(+it.price||0);if(isDone(it))boughtGoods+=s;else{todo++;todoSum+=s;}});
  goods=r2(goods);const commission=Math.round(goods*(+o.commission||0)/100),packing=+o.packing||0,delivery=+o.delivery||0;
  const total=r2(goods+packing+commission+delivery);
  const pays=paysOf(o);const paid=r2(pays.reduce((s,p)=>s+(+p.amount||0)*(+p.rate||1),0));
  const spent=r2(boughtGoods+Math.round(boughtGoods*(+o.commission||0)/100)+packing+delivery);
  return {items,goods,commission,packing,delivery,total,paid,balance:r2(paid-total),n,bought,markup:r2(markup),profit:r2(commission+markup),pays,boughtGoods:r2(boughtGoods),spent,left:r2(paid-spent),todo,todoSum:r2(todoSum)};
}
const ordTitle=o=>'№'+(o.num||'—')+' · '+(o.clientName||'Без клиента');
const supOf=it=>it.priceSup!=null&&it.priceSup!==''?+it.priceSup:(+it.price||0);
const mkPct=()=>0; // наценку вписываем вручную, без процентов
const withMk=(sup,pct)=>sup==null?null:(pct?Math.round(sup*(1+pct/100)):sup);
// цена клиенту пустая → по наценке (или как у поставщика); нет цены поставщика → наценки нет
function priceRec(sup,cli){if(sup==null&&cli==null)return {price:0,priceSup:null};if(sup==null)return {price:cli,priceSup:cli};return {price:cli==null?withMk(sup,mkPct()):cli,priceSup:sup};}
let mkHook=null;
function mkChips(){const p=mkPct(),std=[0,5,10,15,20,30],custom=!std.includes(p);
  return '<div class="mkrow"><span>Наценка</span>'+F.chips('mk','',std.map(v=>[String(v),v?v+'%':'Нет']).concat([['c',custom?p+'%':'Своя…']]),custom?'c':String(p)).replace('class="chips"','class="chips sm"')+'</div>';}
function setMarkup(v){let p;if(v==='c'){const r=prompt('Наценка, % (например 12)',mkPct()||'');if(r==null){redrawMk();return;}p=num(r)||0;}else p=+v||0;
  if(!cache.meta.settings)cache.meta.settings={};cache.meta.settings.markup=p;DB.update('meta','settings',{markup:p});redrawMk();if(mkHook)mkHook(p);toast(p?'Наценка +'+nf.format(p)+'%':'Без наценки');}
function redrawMk(){const r=$('#panel .mkrow');if(r)r.outerHTML=mkChips();}
// связка «цена поставщика → цена клиенту»: пока клиентскую не трогали, она считается сама
function bindAuto(supEl,cliEl,onChange){
  // цена клиенту пустая = как у поставщика (подсказка серым); вписали своё — это и есть наценка
  const ph0=cliEl.getAttribute('placeholder')||'Клиенту';
  const fill=()=>{const sp=num(supEl.value);cliEl.placeholder=sp==null?ph0:'= '+numS(sp);};
  supEl.addEventListener('input',()=>{supEl.value=supEl.value.replace(/[^\d.,]/g,'');fill();onChange&&onChange();});
  cliEl.addEventListener('input',()=>{cliEl.value=cliEl.value.replace(/[^\d.,]/g,'');onChange&&onChange();});
  fill();return fill;
}
function groupItems(items){const gs=[],map={};items.forEach(it=>{const g=(it.group||'').trim();if(!(g in map)){map[g]={g,items:[]};gs.push(map[g]);}map[g].items.push(it);});return gs;}
function nextNum(){return orders().reduce((m,o)=>Math.max(m,+o.num||0),0)+1;}

/* ============ ui state ============ */
const ui={tab:'orders',page:null,oFilter:'active',q:'',cq:'',buyShowDone:false,buyOrder:'all'};

/* ============ renders ============ */
let rafPending=false;
function scheduleRender(){if(rafPending)return;rafPending=true;requestAnimationFrame(()=>{rafPending=false;renderAll();});}
function renderAll(){renderMain();refreshSheet();refreshInvoice();}
function renderMain(){
  const m=$('#main'),tb=$('#tabbar');
  if(!authReady){m.innerHTML='<div class="login"><img class="logo" src="icon.png" alt=""><p class="muted">Загрузка…</p></div>';tb.classList.add('hide');return;}
  if(mode==='cloud'&&!me){m.innerHTML=renderLogin();tb.classList.add('hide');document.body.classList.add('nobar');return;}
  const pageMode=!!ui.page;tb.classList.toggle('hide',pageMode);document.body.classList.toggle('nobar',pageMode);
  const y=window.scrollY;
  if(ui.page&&ui.page.type==='order'){const o=order(ui.page.id);if(!o){ui.page=null;return renderMain();}m.innerHTML=renderOrder(o);}
  else m.innerHTML={orders:renderOrders,buy:renderBuy,clients:renderClients,cash:renderCash,more:renderMore}[ui.tab]();
  $$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===ui.tab));
  hydratePhotos(m);
  if(ui.keepScroll){window.scrollTo(0,y);}ui.keepScroll=true;
}
function go(fn){ui.keepScroll=false;fn();renderMain();window.scrollTo(0,0);}
function renderLogin(){
  return '<div class="login"><img class="logo" src="icon.png" alt=""><h1 style="margin:0 0 4px">Закуп</h1><div class="muted">Войдите своей почтой и паролем</div>'+
    '<input class="field" id="lgE" type="email" placeholder="Почта" autocomplete="username" autocapitalize="off">'+
    '<input class="field" id="lgP" type="password" placeholder="Пароль" autocomplete="current-password">'+
    '<div class="err" id="lgErr"></div><button class="btn primary" data-act="login">Войти</button>'+
    '<div class="hint" style="text-align:center;margin-top:16px">Аккаунты создаёт владелец в консоли Firebase → Authentication → Users.</div></div>';
}
const demoBanner=()=>mode==='local'?'<div class="demo">Демо-режим: данные только на этом телефоне. После подключения Firebase их можно будет перенести.</div>':'';
const stBadge=s=>'<span class="badge '+(ST[s]||ST.pick).c+'">'+(ST[s]||ST.pick).t+'</span>';

/* ---- orders list ---- */
const OF={active:{t:'Активные',f:o=>o.status!=='closed'},await:{t:'Ждут оплату',f:o=>o.status==='await'||o.status==='reserve'},buy:{t:'Закуп',f:o=>['paid','buying','check'].includes(o.status)},ship:{t:'Отправлены',f:o=>o.status==='shipped'},debt:{t:'Должны нам',f:o=>o.status!=='pick'&&calc(o).balance<-0.009},cargo:{t:'Карго не оплачено',f:o=>o.ship&&+o.ship.ourCost>0&&!o.ship.ourPaid},closed:{t:'Закрытые',f:o=>o.status==='closed'}};
function orderRow(o){
  const c=calc(o),cur=o.currency||'RUB';
  const prog=c.n?'выкуплено '+c.bought+'/'+c.n:'нет позиций';
  return '<button class="row" data-act="openOrder" data-id="'+o.id+'"><div style="font-size:26px;flex:none">'+TYPE_IC[o.type||'fabric']+'</div><div class="grow"><div class="t ell">'+esc(ordTitle(o))+'</div><div class="s ell">'+[fmtD(o.date),o.clientCity,prog].filter(Boolean).map(esc).join(' · ')+'</div><div style="margin-top:5px">'+stBadge(o.status)+'</div></div><div class="amt">'+money(c.total,cur)+(o.status!=='pick'&&Math.abs(c.balance)>0.009?'<small class="'+(c.balance<0?'neg':'pos')+'">'+(c.balance<0?'долг ':'переплата ')+nf.format(Math.abs(c.balance))+'</small>':(c.total&&o.status!=='pick'?'<small class="pos">оплачено</small>':''))+'</div></button>';
}
function renderOrders(){
  const all=orders();
  let h='<h1>Заказы</h1>'+demoBanner()+'<div class="pchips">'+Object.keys(OF).map(k=>{const n=all.filter(OF[k].f).length;return '<button class="pchip'+(ui.oFilter===k?' on':'')+'" data-act="oFilter" data-v="'+k+'">'+OF[k].t+(n&&k!=='closed'?'<span class="c">'+n+'</span>':'')+'</button>';}).join('')+'</div>';
  h+='<input class="field" id="oq" type="search" placeholder="🔍 Клиент, город, номер, товар" value="'+esc(ui.q)+'">';
  h+='<div class="btns"><button class="btn primary" data-act="newOrder">+ Новый заказ</button></div><div id="oList">'+ordersList()+'</div>';
  return h;
}
function ordersList(){
  const q=ui.q.trim().toLowerCase();
  let list=orders().filter(OF[ui.oFilter].f);
  if(q)list=list.filter(o=>[o.num,o.clientName,o.clientCity,...itemsOf(o).map(i=>i.name)].join(' ').toLowerCase().includes(q));
  list.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.num||0)-(a.num||0));
  if(!list.length)return '<div class="card empty" style="margin-top:12px"><div class="e">📄</div>'+(orders().length?'Ничего не найдено':'Заказов пока нет.<br>Нажмите «+ Новый заказ» — это ваша новая счёт-фактура.')+'</div>';
  return '<div class="list" style="margin-top:12px">'+list.map(orderRow).join('')+'</div>';
}

/* ---- order page ---- */
function itemRow(o,it,showClient,naBtn){
  const cur=o.currency||'RUB',q=+it.qty||0,sum=q*(+it.price||0);
  const ckCls=it.status==='na'?'na':it.status==='checked'?'v2':isDone(it)?'on':'';
  const ckTxt=it.status==='na'?'✕':it.status==='checked'?'✓✓':'✓';
  const sp_=supOf(it),mk_=+it.price&&sp_&&sp_!==+it.price;
  const sub=[showClient?ordTitle(o):'',mk_?'пост. '+nf.format(sp_)+' → клиенту '+nf.format(+it.price):'',it.req?'просили: '+it.req:'',it.status==='res'?'забронировано':'',it.status==='req'?(o.type==='cosm'?'заказано':'ждём метраж'):'',it.note].filter(Boolean).join(' · ');
  return '<div class="item'+(it.status==='na'?' na':'')+'"><button class="ck '+ckCls+'" data-act="tick" data-o="'+o.id+'" data-i="'+it.id+'" aria-label="Выкуплено">'+ckTxt+'</button>'+(it.photo?'<button class="th" data-act="viewItemPhoto" data-o="'+o.id+'" data-i="'+it.id+'"><img data-ph="'+it.photo+'" alt=""></button>':'')+'<button class="body" data-act="editItem" data-o="'+o.id+'" data-i="'+it.id+'"><div class="nm">'+esc(it.name||'Без названия')+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</button><button class="sum" data-act="editItem" data-o="'+o.id+'" data-i="'+it.id+'"><b>'+(q&&+it.price?nf.format(r2(sum)):'—')+'</b><span>'+(q?nf.format(q)+' '+esc(it.unit||'м'):'? '+esc(it.unit||'м'))+' × '+(+it.price?nf.format(+it.price):'цена?')+'</span></button>'+(naBtn&&!isDone(it)?'<button class="badge m" style="flex:none;padding:8px 10px;font-size:13px" data-act="markNa" data-o="'+o.id+'" data-i="'+it.id+'">нет</button>':'')+'</div>';
}
function leftBox(o,c){
  if(!c.paid||!['paid','buying','check'].includes(o.status)||!c.bought)return '';const cur=o.currency||'RUB';
  const bad=c.left<-0.009;
  return '<div class="box '+(bad?'bad':c.left<c.todoSum?'warn':'good')+'">Выкуплено на <b>'+money(c.boughtGoods,cur)+'</b>'+(+o.commission?' (+'+nf.format(+o.commission)+'% и упаковка = '+nf.format(c.spent)+')':'')+'<br>'+(bad?'⚠ Перерасход: <b>'+money(-c.left,cur)+'</b> — клиент должен доплатить':'Осталось от оплаты: <b>'+money(c.left,cur)+'</b>')+(c.todo?'<br><span class="muted">Ещё к выкупу: '+c.todo+' поз.'+(c.todoSum?' на '+nf.format(c.todoSum):'')+'</span>':'')+'</div>';
}
function renderOrder(o){
  const c=calc(o),cur=o.currency||'RUB',flow=FLOW[o.type||'fabric'],si=flow.indexOf(o.status);
  const cl=o.clientId?client(o.clientId):null;
  let h='<div class="topbar"><button class="back" data-act="back"><b>‹</b>Заказы</button><div class="tt">№'+esc(o.num||'')+'</div><div class="sp"></div></div>';
  h+='<div class="card ohead"><div style="display:flex;gap:10px;align-items:flex-start"><div class="grow"><div class="nm">'+esc(o.clientName||'Без клиента')+'</div><div class="meta">'+[TYPE_IC[o.type||'fabric']+' '+TYPES[o.type||'fabric'],o.clientCity,fmtD(o.date),'счёт в '+(cur==='RUB'?'рублях':'сомах')].filter(Boolean).map(esc).join(' · ')+'</div><div class="meta">'+esc(['Менеджер: '+(o.manager||'—'),'Админ: '+(o.admin||'—')].join(' · '))+'</div></div><button class="btn small" data-act="editOrder" data-id="'+o.id+'">Изменить</button></div>'+
    '<div class="steps">'+flow.map((s,i)=>'<button class="step'+(i<si?' done':'')+(i===si?' cur':'')+'" data-act="setStatus" data-id="'+o.id+'" data-v="'+s+'">'+(i<si?'✓ ':'')+ST[s].t+'</button>').join('')+'</div>'+
    (NEXT[o.status]?'<div class="btns"><button class="btn primary" data-act="nextStatus" data-id="'+o.id+'">→ '+esc(typeof NEXT[o.status]==='string'?NEXT[o.status]:NEXT[o.status][o.type||'fabric'])+'</button></div>':'')+'</div>';
  h+='<div class="money"><div class="card"><div class="l">Итого</div><div class="v">'+nf.format(c.total)+'</div></div><div class="card"><div class="l">Оплачено</div><div class="v pos">'+nf.format(c.paid)+'</div></div><div class="card"><div class="l">'+(c.balance<-0.009?'Долг клиента':c.balance>0.009?'Переплата':'Баланс')+'</div><div class="v '+(c.balance<-0.009?'neg':c.balance>0.009?'pos':'')+'">'+(c.balance<-0.009?'−':'')+nf.format(Math.abs(c.balance))+'</div></div></div>';
  h+=leftBox(o,c);
  h+='<div class="btns two"><button class="btn primary" data-act="invoice" data-id="'+o.id+'">📄 Счёт-фактура</button><button class="btn" data-act="addPay" data-id="'+o.id+'">+ Платёж</button></div>';
  if(c.items.length)h+='<div class="btns"><button class="btn" data-act="supInvoice" data-id="'+o.id+'">📤 Счёт поставщику (PDF)</button></div>';
  // items
  h+='<h2>Товар · '+c.n+' '+plural(c.n,'позиция','позиции','позиций')+'<span>выкуплено '+c.bought+' из '+c.n+'</span></h2>';
  if(c.items.length){h+='<div class="list">'+groupItems(c.items).map(g=>{const gs=g.items.filter(i=>i.status!=='na').reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0);return (g.g||groupItems(c.items).length>1?'<div class="grp">'+esc(g.g||'Без группы')+'<span>'+nf.format(r2(gs))+'</span></div>':'')+g.items.map(it=>itemRow(o,it,false)).join('');}).join('')+'</div>';}
  else h+='<div class="card empty">Позиций пока нет. Добавьте товар, который выбрал клиент.</div>';
  h+='<div class="btns two"><button class="btn primary" data-act="quickAdd" data-id="'+o.id+'">⚡ Быстрый ввод</button><button class="btn" data-act="pasteList" data-id="'+o.id+'">📋 Вставить список</button></div><div class="btns two"><button class="btn" data-act="addItem" data-id="'+o.id+'">+ Одна позиция</button>'+(c.items.length?'<button class="btn" data-act="pricesMode" data-id="'+o.id+'">'+CUR[cur].s+' Цены по накладной</button>':'<span></span>')+'</div>';
  // totals
  h+='<h2>Итог счёта</h2><button class="card tot" style="display:block;width:100%;text-align:left" data-act="editServices" data-id="'+o.id+'">'+
    '<div class="kv"><span>Сумма товара</span><b>'+money(c.goods,cur)+'</b></div><div class="kv"><span>Упаковка / тачка / отправка</span><b>'+money(c.packing,cur)+'</b></div><div class="kv"><span>Комиссия '+nf.format(+o.commission||0)+'%</span><b>'+money(c.commission,cur)+'</b></div>'+
    '<div class="kv"><span>Доставка / погрузка / пресс'+(c.delivery?'':' <span class="muted">(после отправки)</span>')+'</span><b>'+(c.delivery?money(c.delivery,cur):'—')+'</b></div><div class="kv big"><span>Итого</span><b>'+money(c.total,cur)+'</b></div></button><div class="hint">Нажмите, чтобы изменить упаковку, комиссию или доставку.</div>';
  // payments
  h+='<h2>Платежи клиента<span>'+money(c.paid,cur)+'</span></h2>'+(c.pays.length?'<div class="list">'+c.pays.map(p=>'<button class="row" data-act="editPay" data-o="'+o.id+'" data-p="'+p.id+'"><div class="grow"><div class="t">'+esc(p.method||'Платёж')+(p.kind==='delivery'?' · за доставку':'')+'</div><div class="s">'+fmtD(p.date)+(p.cur&&p.cur!==cur?' · '+nf.format(+p.amount)+' '+CUR[p.cur].w+' по курсу '+numS(p.rate):'')+(p.note?' · '+esc(p.note):'')+'</div></div><div class="amt pos">+'+money((+p.amount||0)*(+p.rate||1),cur)+'</div></button>').join('')+'</div>':'<div class="card empty" style="padding:16px">Платежей ещё нет</div>');
  if(isOwner()&&c.goods){h+='<h2>Наш доход<span>видит только владелец</span></h2><div class="card tot"><div class="kv"><span>Комиссия</span><b>'+money(c.commission,cur)+'</b></div><div class="kv"><span>Наценка на товар</span><b>'+money(c.markup,cur)+'</b></div><div class="kv big"><span>Всего</span><b class="pos">'+money(c.profit,cur)+'</b></div></div>';}
  if(cl&&(cl.recipient||cl.phone))h+='<h2>Получатель (для мешка)</h2><div class="card" style="white-space:pre-wrap;font-size:18px;line-height:1.4">'+esc(cl.recipient||[cl.name,cl.city,cl.phone].filter(Boolean).join('\n'))+'</div>';
  h+=shipSection(o,c);
  h+='<div class="btns two" style="margin-top:22px"><button class="btn" data-act="shareText" data-id="'+o.id+'">💬 Текст для клиента</button><button class="btn" data-act="repeatOrder" data-id="'+o.id+'">🔁 Повторить заказ</button></div>';
  if(o.note)h+='<h2>Заметка</h2><div class="card" style="white-space:pre-wrap">'+esc(o.note)+'</div>';
  h+='<div class="btns" style="margin-top:24px"><button class="btn danger" data-act="delOrder" data-id="'+o.id+'">Удалить заказ</button></div>';
  h+='<div class="hint" style="text-align:center">'+(o.updatedBy?'Изменено: '+esc(staffName(o.updatedBy))+', '+new Date(o.updatedAt).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'')+'</div>';
  return h;
}

/* ---- buying ---- */
function renderBuy(){
  const os=orders().filter(o=>['reserve','paid','buying','check'].includes(o.status)).sort((a,b)=>(a.num||0)-(b.num||0));
  if(ui.buyOrder!=='all'&&!os.some(o=>o.id===ui.buyOrder))ui.buyOrder='all';
  let h='<h1>Закуп</h1>'+demoBanner();
  if(!os.length)return h+'<div class="card empty"><div class="e">🛒</div>Здесь появятся позиции заказов в статусах «Бронь», «Оплачен», «Закуп» и «Сверка» — сгруппированные по поставщику / ряду, чтобы обходить рынок по списку.</div>';
  h+='<div class="pchips"><button class="pchip'+(ui.buyOrder==='all'?' on':'')+'" data-act="buyOrder" data-v="all">Все заказы</button>'+os.map(o=>'<button class="pchip'+(ui.buyOrder===o.id?' on':'')+'" data-act="buyOrder" data-v="'+o.id+'">№'+esc(o.num)+' '+esc(o.clientName||'')+'</button>').join('')+'</div>';
  const rows=[];os.filter(o=>ui.buyOrder==='all'||o.id===ui.buyOrder).forEach(o=>itemsOf(o).forEach(it=>{if(it.status==='na')return;if(!ui.buyShowDone&&isDone(it))return;rows.push({o,it});}));
  const total=[];os.filter(o=>ui.buyOrder==='all'||o.id===ui.buyOrder).forEach(o=>itemsOf(o).forEach(it=>{if(it.status!=='na')total.push(it);}));
  const done=total.filter(isDone).length;
  h+='<div class="card" style="display:flex;align-items:center;gap:12px"><div class="grow"><div class="t">Выкуплено '+done+' из '+total.length+'</div><div style="height:8px;border-radius:4px;background:var(--chip);margin-top:8px;overflow:hidden"><i style="display:block;height:100%;width:'+(total.length?done/total.length*100:0).toFixed(1)+'%;background:var(--green)"></i></div></div><button class="btn small" data-act="buyToggle">'+(ui.buyShowDone?'Скрыть выкупленное':'Показать всё')+'</button></div>';
  const vis=os.filter(o=>ui.buyOrder==='all'||o.id===ui.buyOrder);
  const money_=vis.map(o=>{const c=calc(o);if(!c.paid)return '';const cur=o.currency||'RUB',bad=c.left<-0.009;return '<button class="row" data-act="openOrder" data-id="'+o.id+'" style="min-height:50px"><div class="grow"><div class="t ell">№'+esc(o.num)+' '+esc(o.clientName||'')+'</div><div class="s">оплачено '+nf.format(c.paid)+' · выкуплено на '+nf.format(c.spent)+'</div></div><div class="amt '+(bad?'neg':'pos')+'">'+(bad?'−':'')+nf.format(Math.abs(c.left))+'<small class="muted">'+(bad?'перерасход':'осталось')+'</small></div></button>';}).filter(Boolean);
  if(money_.length)h+='<h2>Деньги клиентов на закуп</h2><div class="list">'+money_.join('')+'</div>';
  if(!rows.length)return h+'<div class="card empty" style="margin-top:12px"><div class="e">✅</div>Всё выкуплено!</div>';
  const gs={},order_=[];rows.forEach(r=>{const g=(r.it.group||'').trim()||'Без группы';if(!gs[g]){gs[g]=[];order_.push(g);}gs[g].push(r);});
  h+='<div class="list" style="margin-top:12px">'+order_.map(g=>'<div class="grp">'+esc(g)+'<span>'+gs[g].length+' поз.</span></div>'+gs[g].map(r=>itemRow(r.o,r.it,ui.buyOrder==='all',true)).join('')).join('')+'</div>';
  h+='<div class="hint">Кружок — выкуплено. «нет» — товара нет в наличии (не попадёт в счёт). Группа — контейнер или ряд, задаётся при вводе.</div>';
  return h;
}

/* ---- clients ---- */
function clientStats(id){const os=orders().filter(o=>o.clientId===id);let bal=0,sum=0;os.forEach(o=>{if(o.status==='pick')return;const c=calc(o);bal+=c.balance;sum+=c.total;});return {os,bal:r2(bal),sum:r2(sum)};}
function renderClients(){
  const q=ui.cq.trim().toLowerCase();let list=clients();if(q)list=list.filter(c=>[c.name,c.city,c.phone].join(' ').toLowerCase().includes(q));
  let h='<h1>Клиенты</h1>'+demoBanner()+'<input class="field" id="cq" type="search" placeholder="🔍 Имя, город, телефон" value="'+esc(ui.cq)+'"><div class="btns"><button class="btn primary" data-act="newClient">+ Новый клиент</button></div>';
  if(!list.length)return h+'<div class="card empty" style="margin-top:12px"><div class="e">👥</div>'+(clients().length?'Ничего не найдено':'Клиентов пока нет. Они появятся, когда создадите первый заказ.')+'</div>';
  return h+'<div class="list" style="margin-top:12px">'+list.map(c=>{const s=clientStats(c.id);return '<button class="row" data-act="openClient" data-id="'+c.id+'"><div class="grow"><div class="t ell">'+esc(c.name)+'</div><div class="s ell">'+esc([c.city,s.os.length+' '+plural(s.os.length,'заказ','заказа','заказов')].filter(Boolean).join(' · '))+'</div></div>'+(Math.abs(s.bal)>0.009?'<div class="amt '+(s.bal<0?'neg':'pos')+'">'+(s.bal<0?'долг ':'+')+nf.format(Math.abs(s.bal))+'</div>':'')+'<span class="chev">›</span></button>';}).join('')+'</div>';
}

/* ---- more ---- */
function renderMore(){
  const st=S();
  let h='<h1>Ещё</h1>'+demoBanner()+'<div class="card"><div class="t">'+esc(myName()||'—')+'</div><div class="s">'+(mode==='local'?'Демо-режим, без входа':esc(me.email))+' · '+(isOwner()?'владелец':'админ')+'</div></div>';
  h+='<h2>Настройки</h2><div class="list">'+
    rowBtn('editInvoiceSettings','📄','Счёт-фактура','Название, Instagram, телефон, подвал')+
    rowBtn('editDefaults','⚙️','По умолчанию','Комиссия '+nf.format(st.commission)+'%, упаковка '+nf.format(st.packing)+', курсы')+
    (isOwner()?rowBtn('editStaff','👥','Сотрудники','Имена в счёте и кто владелец'):'')+
    rowBtn('editTheme','🎨','Оформление',THEMES[themeGet().t].n+' · '+{auto:'как в телефоне',light:'светлая',dark:'тёмная'}[themeGet().m])+
    '</div><h2>Сайт для клиентов</h2><div class="list">'+rowBtn('openShop','🛍','Витрина на сайте',Object.keys(cache.shop||{}).length?Object.values(cache.shop).filter(x=>!x.hidden).length+' товаров на сайте':'Товары с фото — клиенты пишут в WhatsApp или Telegram')+
    '</div><h2>Данные</h2><div class="list">'+rowBtn('exportJson','💾','Скачать копию всех данных','Файл JSON на всякий случай')+
    (mode==='local'?rowBtn('importJson','📥','Загрузить копию','Из файла JSON'):'')+'</div>';
  if(mode==='cloud')h+='<div class="btns" style="margin-top:22px"><button class="btn danger" data-act="logout">Выйти</button></div>';
  h+='<div class="hint" style="text-align:center;margin-top:14px">Закуп · этап 1 · '+(mode==='local'?'демо-режим':'облако Firebase')+'<br>Заказов: '+orders().length+', клиентов: '+clients().length+'</div>';
  return h;
}

const stack=[];let hooks={},curSave=null;
function pushSheet(fn){stack.push(fn);drawSheet(true);}
function popSheet(){stack.pop();if(stack.length)drawSheet(false);else hideSheet();}
function closeAll(){stack.length=0;hideSheet();}
function hideSheet(){if(document.activeElement)document.activeElement.blur();$('#sheet').classList.remove('open');hooks={};curSave=null;}
function refreshSheet(){if(stack.length&&stack[stack.length-1].detail){const p=$('#panel'),y=p.scrollTop;drawSheet(false);p.scrollTop=y;}}
const detail=fn=>{fn.detail=true;return fn;};
function drawSheet(isNew){
  const cfg=stack[stack.length-1]();if(!cfg){popSheet();return;}
  const p=$('#panel'),wasOpen=$('#sheet').classList.contains('open');hooks=cfg.hooks||{};
  p.innerHTML='<div class="shh"><button class="lb" data-act="'+(stack.length>1?'backSheet':'closeSheet')+'">'+(cfg.onSave?'Отмена':(stack.length>1?'‹ Назад':'Закрыть'))+'</button><b>'+esc(cfg.title||'')+'</b>'+(cfg.onSave?'<button class="lb r" data-act="sheetSave">'+esc(cfg.saveLabel||'Готово')+'</button>':'<span class="lb"></span>')+'</div><div class="shb">'+cfg.body+'</div>';
  curSave=cfg.onSave?async(extra)=>{const r=await cfg.onSave(extra);if(r!==false&&r!=='stay')popSheet();}:null;
  $('#sheet').classList.add('open');
  if(isNew){p.scrollTop=0;if(!wasOpen){p.classList.remove('anim');void p.offsetWidth;p.classList.add('anim');}}
  hydratePhotos(p);
  if(cfg.onOpen)cfg.onOpen(p);
}

function normUnit(u){for(const [re,v] of UNIT_MAP)if(re.test(u))return v;return null;}
function parseList(text){
  const units='штуки|штука|штук|шт|упаковки|упак|уп|пачки|пачек|пач|метров|метра|метр|м|рулона|рулон|рул|кг|бут';
  return text.split(/\n|;/).map(s=>s.trim()).filter(Boolean).map(l0=>{
    let l=' '+l0.replace(/^\s*(?:[-–—*•]+|\d{1,3}[.)])\s+/,'')+' ';let qty=null,price=null,unit=null,cli=null,m;
    if((m=l.match(/(\d+(?:[.,]\d+)?)\s*(?:\/|→|->)\s*(\d+(?:[.,]\d+)?)(?!.*\d\s*(?:\/|→|->)\s*\d)/))){price=num(m[1]);cli=num(m[2]);l=l.replace(m[0],' ');}
    if((m=l.match(/\s(?:по|x|х|×|\*)\s*(\d+(?:[.,]\d+)?)(?=\D|$)/i))){price=num(m[1]);l=l.replace(m[0],' ');}
    if((m=l.match(new RegExp('(\\d+(?:[.,]\\d+)?)\\s*('+units+')\\.?(?=[\\s,;:)]|$)','i')))){qty=num(m[1]);unit=normUnit(m[2]);l=l.replace(m[0],' ');}
    if((m=l.match(/(?:\s(\d+(?:[.,]\d+)?)){1,2}\s*[,.;:]?\s*$/))){const ns=m[0].trim().replace(/[,.;:]$/,'').split(/\s+/).map(num);
      if(qty==null){qty=ns[0];if(ns.length>1&&price==null)price=ns[1];}else if(price==null)price=ns[ns.length-1];l=l.slice(0,l.length-m[0].length);}
    const name=l.replace(/[\s\-–—:,=]+$/,'').replace(/^[\s\-–—:,]+/,'').replace(/\s{2,}/g,' ').trim();
    return {name:name||l0,qty,price,cli,unit};
  }).filter(r=>r.name);
}

    if(o.ship&&+o.ship.ourCost>0&&!o.ship.ourPaid)cargoDue.push({o,c});

    if(o.status==='closed')return;

    b.spentGoods+=sup;if(o.ship&&o.ship.ourPaid&&(o.ship.ourCur||cur)===cur)b.cargo+=+o.ship.ourCost||0;

      '<div class="hint" style="margin:6px 0 0">По '+b.n+' незакрытым '+plural(b.n,'заказу','заказам','заказам')+'. Платежи в другой валюте пересчитаны по курсу из платежа.</div></div>';});
  if(cargoDue.length){const tot={};cargoDue.forEach(x=>{const k=x.o.ship.ourCur||'KGS';tot[k]=(tot[k]||0)+ +x.o.ship.ourCost;});
    h+='<h2>Карго к оплате<span>'+Object.keys(tot).map(k=>money(tot[k],k)).join(' + ')+'</span></h2><div class="list">'+cargoDue.map(x=>'<div class="row"><button class="grow" style="text-align:left" data-act="openOrder" data-id="'+x.o.id+'"><div class="t ell">'+esc(ordTitle(x.o))+'</div><div class="s">'+esc(x.o.ship.carrier||'')+(x.o.ship.waybill?' · № '+esc(x.o.ship.waybill):'')+(x.o.ship.date?' · '+fmtD(x.o.ship.date):'')+'</div></button><div class="amt neg">'+money(+x.o.ship.ourCost,x.o.ship.ourCur||'KGS')+'</div><button class="badge g" style="padding:8px 10px;font-size:13px" data-act="cargoPaid" data-id="'+x.o.id+'">оплачено</button></div>').join('')+'</div>';}
  if(debts.length){h+='<h2>Клиенты должны</h2><div class="list">'+debts.sort((a,b)=>a.c.balance-b.c.balance).map(x=>'<button class="row" data-act="openOrder" data-id="'+x.o.id+'"><div class="grow"><div class="t ell">'+esc(ordTitle(x.o))+'</div><div class="s">'+ST[x.o.status].t+(x.o.status==='shipped'&&x.c.delivery?' · за доставку':'')+'</div></div><div class="amt neg">'+money(-x.c.balance,x.o.currency||'RUB')+'</div></button>').join('')+'</div>';}
  if(overs.length){h+='<h2>Переплаты клиентов (их деньги у нас)</h2><div class="list">'+overs.map(x=>'<button class="row" data-act="openOrder" data-id="'+x.o.id+'"><div class="grow"><div class="t ell">'+esc(ordTitle(x.o))+'</div><div class="s">'+ST[x.o.status].t+'</div></div><div class="amt pos">'+money(x.c.balance,x.o.currency||'RUB')+'</div></button>').join('')+'</div>';}

    obj(id+1,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
    offs[id+2]=len;push((id+2)+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.jpg.length+' >>\nstream\n');push(p.jpg);push('\nendstream\nendobj\n');});
  const n=3+3*pages.length,xref=len;let x='xref\n0 '+n+'\n0000000000 65535 f \n';for(let i=1;i<n;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(x+'trailer\n<< /Size '+n+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  return new Blob(parts,{type:'application/pdf'});
}
const fileSafe=t=>String(t).replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim();
let invOpen=null,invMode='client';
function showInvoice(oid,mode){invOpen=oid;invMode=mode||'client';if(invMode==='sup'){const o=order(oid);const gs=o?groupItems(itemsOf(o).filter(i=>i.status!=='na')).map(g=>g.g).filter(Boolean):[];if(!gs.includes(supOpt.g))supOpt.g='*';}refreshInvoice();$('#inv').classList.add('show');$('#inv').scrollTop=0;}
function curInvoice(o){return invMode==='sup'?supplierSVG(o,supOpt):invoiceSVG(o);}
function refreshInvoice(){if(!invOpen)return;const o=order(invOpen);if(!o){$('#inv').classList.remove('show');invOpen=null;return;}const r=curInvoice(o);
  let bar;

    bar='<button data-act="closeInvoice">✕</button><div class="gap"></div><button class="pr" data-act="sharePdf">📤 PDF поставщику</button><button data-act="sharePng">📷</button>'+
      '<div class="invopts"><select id="so_f">'+[['all','Все позиции'],['done','Только выкупленные'],['todo','Ещё не выкуплены']].map(v=>'<option value="'+v[0]+'"'+(supOpt.f===v[0]?' selected':'')+'>'+v[1]+'</option>').join('')+'</select>'+
      (gs.length?'<select id="so_g"><option value="*">Все поставщики</option>'+gs.map(g=>'<option'+(supOpt.g===g?' selected':'')+'>'+esc(g)+'</option>').join('')+'</select>':'')+
      '<label><input type="checkbox" id="so_c"'+(supOpt.cl?' checked':'')+' style="width:20px;height:20px;accent-color:var(--accent)">Клиент</label></div>';}
  else bar='<button data-act="closeInvoice">✕</button><div class="gap"></div><button class="pr" data-act="sharePdf">📄 PDF</button><button data-act="sharePng">📷 Картинка</button><button data-act="shareTextInv">💬 Текст</button>';
  $('#inv').innerHTML='<div class="invbar noprint">'+bar+'</div><div class="invpage">'+r.svg+'</div>';

}
function invFileName(o,ext){return fileSafe(invMode==='sup'?'Счёт поставщику №'+o.num+(supOpt.g!=='*'?' '+supOpt.g:'')+'.'+ext:'Счёт №'+o.num+' '+(o.clientName||'')+'.'+ext);}
async function svgToPngBlob(svg,w,h,scale){
  const img=new Image();const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  await new Promise((res,rej)=>{img.onload=res;img.onerror=()=>rej(new Error('svg'));img.src=url;});
  const cv=document.createElement('canvas');cv.width=w*scale;cv.height=h*scale;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(img,0,0,cv.width,cv.height);
  return new Promise(r=>cv.toBlob(r,'image/png'));
}
async function shareBlob(name,blob){
  try{const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true;}}
  catch(e){if(e&&e.name==='AbortError')return false;}
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return true;
}
